name: CI and Smoke Tests

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  application-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile main.py

      - name: Start application
        run: |
          uvicorn main:app --host 127.0.0.1 --port 8000 > /tmp/accountant.log 2>&1 &
          echo $! > /tmp/accountant.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/accountant.log
          exit 1

      - name: Smoke - base and admin UI
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash scripts/smoke_test.sh base

      - name: Smoke - backup and restore
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash scripts/smoke_test.sh backup

      - name: Smoke - role permissions
        env:
          BASE_URL: http://127.0.0.1:8000
        run: bash scripts/smoke_test.sh roles

      - name: Wait for staging deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          for i in {1..60}; do
            if curl -fsS https://accountant-staging.onrender.com/health | grep -q '"version":"0.6.0"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Staging did not deploy version 0.6.0 in time"
          exit 1

      - name: Smoke - deployed staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          BASE_URL: https://accountant-staging.onrender.com
        run: bash scripts/smoke_test.sh remote

      - name: Wait for production deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for i in {1..60}; do
            if curl -fsS https://accountant-b7hw.onrender.com/health | grep -q '"version":"0.6.0"'; then
              exit 0
            fi
            sleep 5
          done
          echo "Production did not deploy version 0.6.0 in time"
          exit 1

      - name: Smoke - deployed production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://accountant-b7hw.onrender.com
        run: bash scripts/smoke_test.sh remote

      - name: Print application log on failure
        if: failure()
        run: cat /tmp/accountant.log || true
